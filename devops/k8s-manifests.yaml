
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-ledger-service
  labels:
    app: account-ledger-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-ledger-service
  template:
    metadata:
      labels:
        app: account-ledger-service
    spec:
      containers:
        - name: account-ledger-service
          image: <TU_REGISTRY>/account-ledger-service:1.0.0
          ports:
            - name: http
              containerPort: 8081
            - name: grpc
              containerPort: 9001
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: account-ledger-service
spec:
  # ClusterIP: solo accesible dentro del clúster — coherente con
  # "Acceso: CERRADO al exterior" que exige el reto para este servicio.
  type: ClusterIP
  selector:
    app: account-ledger-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9001
      targetPort: 9001